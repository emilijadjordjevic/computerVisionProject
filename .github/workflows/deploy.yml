name: Deploy Markdown to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Convert Markdown to HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          mkdir -p /tmp/site
          cp -r . /tmp/site/
          rm -rf /tmp/site/.git /tmp/site/.github
          pandoc index.md -s -o /tmp/site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
